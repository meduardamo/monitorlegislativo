name: Monitor Legislativo

on:
  schedule:
    - cron: "18 11 * * *"  # 08:18 BRT
    - cron: "18 15 * * *"  # 12:18 BRT
    - cron: "18 17 * * *"  # 14:18 BRT
    - cron: "18 20 * * *"  # 17:18 BRT
    - cron: "18 2 * * *"   # 23:18 BRT
  workflow_dispatch:
    inputs:
      data:
        description: "Backfill de um dia (YYYY-MM-DD). Vazio = hoje."
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    # sem isso o default é 360 min: uma queda longa da Câmara segurava o runner
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write service account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_JSON }}
        run: |
          echo "$GCP_SA_KEY" > credentials.json

      - name: Run collector
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SPREADSHEET_ID_CLIENTES: ${{ secrets.SPREADSHEET_ID_CLIENTES }}
          SHEET_SENADO: ${{ secrets.SHEET_SENADO }}
          SHEET_CAMARA: ${{ secrets.SHEET_CAMARA }}
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          DATA_OVERRIDE: ${{ github.event.inputs.data }}
        run: |
          python monitor_legislativo.py

      - name: Run alignment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPREADSHEET_ID_CLIENTES: ${{ secrets.SPREADSHEET_ID_CLIENTES }}
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          # Optional tuning:
          # ALIGN_BATCH_SIZE: "20"
          # ALIGN_SLEEP_SEC: "0"
          # ALIGN_READ_RANGE: "A1:Z5000"
        run: |
          python alinhamento.py
